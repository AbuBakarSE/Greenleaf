<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css"/>
    <link href="./output.css" rel="stylesheet" />
    <title>Green-leaf</title>
</head>
<body>
    <header id="navbar" class="w-full">
      <div  class=" mx-auto flex items-center justify-between px-6 py-5 md:px-30">

        <!-- Logo -->
         <a href="index.html" class="flex">
          <img src="../images/Logo.png" alt="Logo" class="size-9">
          <h1 class="text-2xl text-[#13261B] md:text-2xl font-[400]">Greenleaf</h1>
         </a>
        

        <!-- Desktop Menu -->
        <nav class="hidden md:flex">
          <ul
            class="font-poppins flex items-center gap-6 text-[#5b6b64] hover:text-[#3f4f49] transition duration-200"
          >
            <li>
              <a href="index.html" class="hover:border-b-2 border-green-600 pb-1"
                >Home</a
              >
            </li>
            <li>
              <a href="#" class="hover:border-b-2 border-green-600 pb-1"
                >Service</a
              >
            </li>
            <li>
              <a href="#" class="hover:border-b-2 border-green-600 pb-1"
                >About</a
              >
            </li>
            <li>
              <a href="#" class="hover:border-b-2 border-green-600 pb-1"
                >Blog</a
              >
            </li>
            <li>
              <a href="#" class="hover:border-b-2 border-green-600 pb-1"
                >Contact</a
              >
            </li>
            <i class="fa-solid fa-magnifying-glass-minus"></i>
          </ul>
        </nav>

        <!-- Hamburger Icon (Mobile) -->
        <div class="md:hidden px-4">
          <button type="button" id="menu-btn" aria-label="button" class="text-2xl focus:outline-none">
            <span class="fa-solid fa-bars"></span>
          </button>
        </div>
      </div>

      <!-- Mobile Menu (hidden by default) -->
      <div id="mobile-menu" class="hidden md:hidden bg-white px-6 pb-4">
        <ul class="flex flex-col gap-4 text-[#5b6b64]">
          <li>
            <a href="index.html" class="hover:border-b-2 border-green-600 pb-1">Home</a>
          </li>
          <li>
            <a href="#" class="hover:border-b-2 border-green-600 pb-1"
              >Service</a
            >
          </li>
          <li>
            <a href="about.html" class="hover:border-b-2 border-green-600 pb-1">About</a>
          </li>
          <li>
            <a href="#" class="hover:border-b-2 border-green-600 pb-1">Blog</a>
          </li>
          <li>
            <a href="#" class="hover:border-b-2 border-green-600 pb-1"
              >Contact</a
            >
          </li>
        </ul>
      </div>
    </header>

<!-- Blog -->
    <Section>
        <h4 class="mt-5 md:mt-15 bg-[#f3f6f5] text-[#5b6b64] font-[400] text-center w-40 mx-auto rounded-4xl">Research & insights</h4>
        <h1 class="text-center my-8 text-7xl font-[500]">The Greenleaf blog</h1>
        <p class="text-center text-[#5b6b64] text-lg">Research and insights for forward-thinking businesses.</p>

        <div class="grid grid-cols-1 md:grid-cols-2 px-20 ">

        </div>
    </Section>
    
</body>
</html>
